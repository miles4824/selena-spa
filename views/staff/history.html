    <div>
      <h2 class="text-2xl font-extrabold text-[#2D2424]">Nhật Ký Ca Của Tôi</h2>
      <p class="text-xs sm:text-sm text-[#7E7272]">Danh sách các ca bạn đã phục vụ</p>
