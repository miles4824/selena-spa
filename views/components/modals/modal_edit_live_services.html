<!-- MODAL ĐỔI & THÊM DỊCH VỤ GIỮA CA PHỤC VỤ (MODAL EDIT LIVE SERVICES) -->
<div id="modal-edit-live-services" class="fixed inset-0 z-[999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-xs hidden transition-all duration-300">
  <div class="relative w-full max-w-lg bg-[#FAF6F1] rounded-3xl shadow-2xl border border-[#EFE8DF] overflow-hidden max-h-[92vh] flex flex-col animate-in fade-in zoom-in-95">
    
    <!-- HEADER -->
    <div class="p-4 sm:p-5 bg-white border-b border-[#EFE8DF] flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-[#FFF0EB] flex items-center justify-center text-[#E58A7B] shadow-2xs">
          <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-medium text-xl uppercase text-[#2D2424]">Điều chỉnh dịch vụ</h3>
          <p id="modal-edit-live-customer-info" class="text-xs text-[#7E7272] mt-0.5">Khách: Khách vãng lai</p>
        </div>
      </div>
      <button type="button" onclick="closeModalEditLiveServices()" class="p-2 text-[#A39696] hover:text-[#2D2424] hover:bg-gray-100 rounded-full transition cursor-pointer">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- BODY (SCROLLABLE) -->
    <div class="p-4 sm:p-5 space-y-4 overflow-y-auto flex-1">
      
      <!-- HÀNG 1: CHỌN NHANH COMBO (SINGLE COMBO RULE) -->
      <div class="space-y-2">
        <div class="text-[11px] font-extrabold text-[#7E7272] flex items-center gap-1.5">
          <i data-lucide="zap" class="w-3.5 h-3.5 text-[#E58A7B]"></i>
          <span>Gói Combo Chính (Tối đa 1 combo):</span>
        </div>
        <div id="modal-edit-live-quick-combos" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- ĐƯỜNG DASH NGĂN CÁCH -->
      <div class="border-t border-dashed border-[#E8E1D7] my-2"></div>

      <!-- HÀNG 2: MULTI-TAG COMBOBOX DỊCH VỤ ĐÃ CHỌN -->
      <div class="space-y-2.5">
        <div class="flex justify-between items-center px-0.5">
          <span class="text-xs font-black text-[#7E7272] uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="clipboard-list" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Dịch Vụ Đang Chọn:
          </span>
          <span id="modal-edit-live-count-badge" class="text-[10px] font-black px-2.5 py-0.5 rounded-full bg-[#E8F8F5] text-[#2E7D6D] border border-[#B7EBDD]">
            1 dịch vụ
          </span>
        </div>

        <!-- HỘP MULTI-TAGS KÈM DROPDOWN TRIGGER -->
        <div class="relative">
          <div id="modal-edit-live-tag-container" class="min-h-[56px] p-3 bg-white border border-[#E8E1D7] hover:border-[#E58A7B]/60 rounded-2xl flex flex-col gap-2.5 cursor-pointer transition-all focus-within:border-[#E58A7B] focus-within:ring-2 focus-within:ring-[#E58A7B]/20 shadow-2xs" onclick="toggleModalCustomDropdownPopover(event)">
            <!-- Danh sách Chips dịch vụ -->
            <div id="modal-edit-live-chips-list" class="flex flex-wrap gap-2.5"></div>
            
            <!-- Nút trigger mở menu thả xuống -->
            <div id="modal-edit-live-trigger-row" class="w-full flex items-center justify-between text-xs font-bold text-[#7E7272] hover:text-[#E58A7B] py-3 mt-1 px-3 rounded-xl bg-[#FAF6F1]/80 hover:bg-[#FFF0EB] transition border border-dashed border-[#EAE2D7]">
              <span id="modal-edit-live-placeholder-text" class="flex items-center gap-1.5 truncate">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5 text-[#E58A7B]"></i>
                <span>-- Chọn thêm dịch vụ từ menu --</span>
              </span>
              <i id="modal-edit-live-chevron" data-lucide="chevron-down" class="w-4 h-4 text-[#A39696] transition-transform duration-200 shrink-0 ml-1"></i>
            </div>
          </div>

          <!-- POPOVER MENU THẢ XUỐNG CÓ TÌM KIẾM -->
          <div id="modal-edit-live-popover" class="hidden absolute left-0 right-0 top-full mt-2 bg-white border border-[#EFE8DF] rounded-2xl shadow-2xl ring-1 ring-black/5 z-50 overflow-hidden flex flex-col animate-in fade-in zoom-in-95">
            <!-- Ô TÌM KIẾM NHANH TRONG MODAL -->
            <div class="p-2 border-b border-[#F5EFE9] bg-[#FAF6F1]/90 sticky top-0 z-20" onclick="event.stopPropagation()">
              <div class="relative flex items-center">
                <i data-lucide="search" class="w-3.5 h-3.5 text-[#A39696] absolute left-2.5 pointer-events-none"></i>
                <input type="text" id="modal-menu-search-input" oninput="onModalMenuSearchInput(this.value)" placeholder="Tìm kiếm nhanh dịch vụ..." class="w-full pl-8 pr-7 py-2 text-xs bg-white border border-[#EFE8DF] rounded-xl text-[#2D2424] placeholder:text-[#A39696] focus:outline-none focus:border-[#E58A7B] focus:ring-1 focus:ring-[#E58A7B]/30 font-medium transition" autocomplete="off" />
                <button type="button" id="btn-clear-modal-menu-search" onclick="clearModalMenuSearch()" class="hidden absolute right-2 text-[#A39696] hover:text-[#E58A7B] p-0.5 cursor-pointer">
                  <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
            <div id="modal-edit-live-dropdown-items" class="p-2 space-y-1 max-h-56 overflow-y-auto"></div>
          </div>
        </div>
      </div>

      <!-- ĐƯỜNG DASH NGĂN CÁCH TRƯỚC PHẦN TỔNG -->
      <div class="border-t border-dashed border-[#E8E1D7] my-2"></div>

      <!-- THẺ TỔNG HỢP THỜI GIAN & TỔNG TIỀN MỚI -->
      <div class="p-3.5 px-4 rounded-2xl bg-gradient-to-r from-[#FFF5F2] via-[#FFF9F6] to-[#FAF6F1] border border-[#F5DCD5] flex justify-between items-center shadow-xs">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-[#E58A7B]/15 flex items-center justify-center text-[#E58A7B] shrink-0">
            <i data-lucide="receipt" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-[10px] font-black text-[#7E7272] uppercase tracking-wider">Tổng Thanh Toán Mới</div>
            <div id="modal-edit-live-total-price" class="text-xl font-black font-mono text-[#E58A7B] tracking-tight leading-none mt-0.5">64.000 đ</div>
          </div>
        </div>

        <div class="flex flex-col items-end">
          <div class="flex items-center gap-1.5 px-3 py-1 rounded-xl bg-white border border-[#E8E1D7] text-xs font-black text-[#2E7D6D] shadow-2xs">
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span id="modal-edit-live-total-duration">50 phút</span>
          </div>
          <span id="modal-edit-live-remaining-note" class="text-[10px] text-[#7E7272] font-semibold mt-1">Còn lại khoảng 45 phút</span>
        </div>
      </div>

    </div>

    <!-- FOOTER ACTION BUTTONS -->
    <div class="p-4 bg-white border-t border-[#EFE8DF] flex gap-3">
      <button type="button" onclick="closeModalEditLiveServices()" class="flex-1 py-3 px-4 rounded-2xl border border-[#E8E1D7] text-[#7E7272] font-bold text-xs hover:bg-gray-50 transition cursor-pointer">
        Hủy / Đóng
      </button>
      <button type="button" onclick="saveModalEditLiveServices()" class="flex-1 py-3 px-4 rounded-2xl bg-[#E58A7B] hover:bg-[#D9796A] text-white font-black text-xs flex items-center justify-center gap-1.5 transition active:scale-95 shadow-md shadow-[#E58A7B]/25 cursor-pointer">
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>Xác Nhận Thay Đổi</span>
      </button>
    </div>

  </div>
</div>
