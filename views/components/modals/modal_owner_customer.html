<!-- COMPONENT: MODAL QUẢN TRỊ HỒ SƠ KHÁCH HÀNG (CHỦ TIỆM) -->
<div id="modal-owner-customer-editor" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs" onclick="if(event.target === this) closeOwnerCustomerEditorModal()">
  <div class="w-full max-w-md bg-white rounded-[32px] border border-[#F0EAE1] shadow-[0_25px_50px_-12px_rgba(45,36,36,0.15)] p-6 space-y-4 relative my-auto animate-in fade-in zoom-in-95">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-[#E8F8F5] flex items-center justify-center text-[#2E7D6D]">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-[#2D2424]">Thông tin khách hàng</h3>
          <p class="text-xs text-[#7E7272]">Dành riêng cho Chủ Tiệm</p>
        </div>
      </div>
      <button type="button" onclick="closeOwnerCustomerEditorModal()" class="p-2 rounded-xl hover:bg-[#FAF6F1] text-[#7E7272] hover:text-[#E58A7B] transition cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <form onsubmit="handleSaveOwnerCustomerEditor(event)" class="space-y-3.5">
      <input type="hidden" id="modal-owner-edit-raw-phone">
      <input type="hidden" id="modal-owner-edit-receipt-id">

      <!-- HÀNG 1: SỐ ĐIỆN THOẠI (TOÀN CHIỀU RỘNG) -->
      <div>
        <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
          <i data-lucide="phone" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Số Điện Thoại:
        </label>
        <div class="relative">
          <input type="tel" id="modal-owner-edit-phone" placeholder="0799625591" class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] font-mono font-bold focus:outline-none focus:border-[#2E7D6D] focus:bg-white transition" required>
        </div>
      </div>

      <!-- HÀNG 2: [TÊN KHÁCH HÀNG] [SINH NHẬT] (GRID 2 CỘT) -->
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
            <i data-lucide="user" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Tên Khách Hàng:
          </label>
          <input type="text" id="modal-owner-edit-name" placeholder="VD: Chị Ngân Ngân" class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] font-bold focus:outline-none focus:border-[#2E7D6D] focus:bg-white transition" required>
        </div>
        <div>
          <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
            <i data-lucide="cake" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Sinh Nhật:
          </label>
          <select id="modal-owner-edit-birth-month" class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] font-bold focus:outline-none focus:border-[#2E7D6D] focus:bg-white transition cursor-pointer">
            <option value="">-- Tháng --</option>
            <option value="1">Tháng 1</option>
            <option value="2">Tháng 2</option>
            <option value="3">Tháng 3</option>
            <option value="4">Tháng 4</option>
            <option value="5">Tháng 5</option>
            <option value="6">Tháng 6</option>
            <option value="7">Tháng 7</option>
            <option value="8">Tháng 8</option>
            <option value="9">Tháng 9</option>
            <option value="10">Tháng 10</option>
            <option value="11">Tháng 11</option>
            <option value="12">Tháng 12</option>
          </select>
        </div>
      </div>

      <!-- Thống kê chu kỳ 60 ngày của khách -->
      <div class="p-3 rounded-2xl bg-[#FAF6F1] border border-[#F0EAE1] text-xs space-y-1.5 text-[#7E7272]">
        <div class="flex justify-between items-center">
          <span class="flex items-center gap-1"><i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Chu kỳ tích điểm (60 ngày):</span>
          <span id="modal-owner-edit-cycle-visits" class="font-extrabold text-[#2E7D6D]">1 / 10 lần</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="flex items-center gap-1"><i data-lucide="gift" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Số voucher hiện có:</span>
          <span id="modal-owner-edit-voucher-count" class="font-extrabold text-[#E58A7B]">0 voucher</span>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#2E7D6D]"></i> Ghi Chú Sở Thích / Lưu Ý:
        </label>
        <textarea id="modal-owner-edit-notes" rows="3" placeholder="Ghi chú chi tiết sở thích hoặc lưu ý về khách..." class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] focus:outline-none focus:border-[#2E7D6D] focus:bg-white transition leading-relaxed"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeOwnerCustomerEditorModal()" class="flex-1 py-3 rounded-full bg-[#F7F2EC] hover:bg-[#EFE8DF] text-[#7E7272] font-bold text-xs sm:text-sm cursor-pointer">Đóng</button>
        <button type="submit" class="flex-1 py-3 rounded-full bg-[#2E7D6D] hover:bg-[#256659] text-white font-bold text-xs sm:text-sm shadow-md shadow-[#2E7D6D]/20 flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="check" class="w-4 h-4"></i> Cập Nhật Hồ Sơ
        </button>
      </div>
    </form>
  </div>
</div>
