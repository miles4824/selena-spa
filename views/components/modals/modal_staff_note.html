<!-- COMPONENT: MODAL GHI CHÚ DÀNH CHO KTV (STAFF) -->
<div id="modal-staff-customer-note" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs" onclick="if(event.target === this) closeStaffCustomerNoteModal()">
  <div class="w-full max-w-md bg-white rounded-[32px] border border-[#F0EAE1] shadow-[0_25px_50px_-12px_rgba(45,36,36,0.15)] p-6 space-y-4 relative my-auto animate-in fade-in zoom-in-95">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-2xl bg-[#FFF0EB] flex items-center justify-center text-[#E58A7B]">
          <i data-lucide="edit-3" class="w-4.5 h-4.5"></i>
        </div>
        <div>
          <h3 class="text-base font-extrabold text-[#2D2424]" id="modal-staff-note-name">Ghi Chú Khách Hàng</h3>
          <p class="text-xs text-[#7E7272] font-mono" id="modal-staff-note-phone">094*144</p>
        </div>
      </div>
      <button type="button" onclick="closeStaffCustomerNoteModal()" class="p-2 rounded-xl hover:bg-[#FAF6F1] text-[#7E7272] hover:text-[#E58A7B] transition cursor-pointer">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <form onsubmit="handleSaveStaffCustomerNote(event)" class="space-y-3.5">
      <input type="hidden" id="modal-staff-note-raw-phone">
      <input type="hidden" id="modal-staff-note-receipt-id">
      <input type="hidden" id="modal-staff-note-is-guest" value="0">
      
      <!-- CỤM KHUNG GOM BỔ SUNG THÔNG TIN KHÁCH (CHỈ HIỆN KHI LÀ KHÁCH VÃNG LAI) -->
      <div id="modal-staff-note-guest-inputs" class="hidden space-y-3 bg-[#FAF6F1] p-3.5 rounded-2xl border border-[#FCDFD7]">
        <div class="text-xs font-bold text-[#E58A7B] flex items-center justify-between">
          <span class="flex items-center gap-1.5"><i data-lucide="user-plus" class="w-4 h-4 text-[#E58A7B]"></i> Bổ Sung Thông Tin Khách:</span>
          <span id="modal-staff-note-lookup-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-white font-semibold text-[#7E7272] border border-[#F0EAE1]">Nhập SĐT để dò tìm</span>
        </div>

        <!-- HÀNG 1: SỐ ĐIỆN THOẠI & DROPDOWN GỢI Ý CHUẨN POS -->
        <div class="relative">
          <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
            <i data-lucide="phone" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Số Điện Thoại:
          </label>
          <div class="relative">
            <input type="tel" id="modal-staff-note-guest-phone" oninput="onStaffGuestPhoneInput(this.value)" onfocus="onStaffGuestPhoneInput(this.value)" autocomplete="off" placeholder="0799625591" class="w-full bg-white border border-[#EFE8DF] rounded-xl p-2.5 pl-9 text-xs sm:text-sm text-[#2D2424] font-mono font-bold focus:outline-none focus:border-[#E58A7B] transition">
            <i data-lucide="phone" class="w-3.5 h-3.5 text-[#A39696] absolute left-3 top-1/2 -translate-y-1/2"></i>
          </div>
          <!-- BẢNG SỔ XUỐNG GỢI Ý CHUẨN POS -->
          <div id="modal-staff-note-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-[#EFE8DF] rounded-2xl shadow-2xl z-[999] max-h-52 overflow-y-auto divide-y divide-[#FAF6F1]"></div>
          <p id="modal-staff-note-phone-hint" class="text-[11px] text-[#A39696] mt-1 italic hidden"></p>
        </div>

        <!-- HÀNG 2: [TÊN KHÁCH HÀNG] [SINH NHẬT] (GRID 2 CỘT) -->
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
              <i data-lucide="user" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Tên Khách Hàng:
            </label>
            <input type="text" id="modal-staff-note-guest-name" placeholder="VD: Chị Mai Lan" class="w-full bg-white border border-[#EFE8DF] rounded-xl p-2.5 text-xs sm:text-sm text-[#2D2424] font-medium focus:outline-none focus:border-[#E58A7B] transition">
          </div>

          <div id="modal-staff-note-guest-month-container">
            <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
              <i data-lucide="cake" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Sinh Nhật:
            </label>
            <select id="modal-staff-note-guest-birth-month" class="w-full bg-white border border-[#EFE8DF] rounded-xl p-2.5 text-xs sm:text-sm text-[#2D2424] font-bold focus:outline-none focus:border-[#E58A7B] transition cursor-pointer">
              <option value="">-- Tháng --</option>
              <option value="1">Tháng 1</option>
              <option value="2">Tháng 2</option>
              <option value="3">Tháng 3</option>
              <option value="4">Tháng 4</option>
              <option value="5">Tháng 5</option>
              <option value="6">Tháng 6</option>
              <option value="7">Tháng 7</option>
              <option value="8">Tháng 8</option>
              <option value="9">Tháng 9</option>
              <option value="10">Tháng 10</option>
              <option value="11">Tháng 11</option>
              <option value="12">Tháng 12</option>
            </select>
          </div>

          <div id="modal-staff-note-guest-month-fixed" class="hidden text-xs font-bold text-[#2E7D6D] bg-[#E8F8F5] p-2.5 rounded-xl border border-[#B7EBDD] flex items-center gap-1.5">
            <i data-lucide="cake" class="w-4 h-4 text-[#2E7D6D]"></i>
            <span id="modal-staff-note-guest-month-fixed-text">Tháng --</span>
          </div>
        </div>
      </div>

      <!-- MỤC THÁNG SINH NHẬT DÀNH CHO KHÁCH QUEN (KHI GUEST INPUTS ĐANG ẨN) -->
      <div id="modal-staff-note-regular-month-section" class="space-y-1">
        <!-- 1. Ô CHỌN THÁNG CHO KHÁCH QUEN CHƯA CÓ THÁNG SINH -->
        <div id="modal-staff-note-regular-month-container">
          <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
            <i data-lucide="cake" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Sinh Nhật:
          </label>
          <select id="modal-staff-note-regular-birth-month" class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] font-bold focus:outline-none focus:border-[#E58A7B] focus:bg-white transition cursor-pointer">
            <option value="">-- Chọn tháng sinh (để tiệm tặng voucher 20%) --</option>
            <option value="1">Tháng 1</option>
            <option value="2">Tháng 2</option>
            <option value="3">Tháng 3</option>
            <option value="4">Tháng 4</option>
            <option value="5">Tháng 5</option>
            <option value="6">Tháng 6</option>
            <option value="7">Tháng 7</option>
            <option value="8">Tháng 8</option>
            <option value="9">Tháng 9</option>
            <option value="10">Tháng 10</option>
            <option value="11">Tháng 11</option>
            <option value="12">Tháng 12</option>
          </select>
        </div>

        <!-- 2. THÔNG BÁO CHO KHÁCH QUEN ĐÃ CÓ THÁNG SINH (KHÓA CỐ ĐỊNH) -->
        <div id="modal-staff-note-regular-month-fixed" class="hidden text-xs font-bold text-[#2E7D6D] bg-[#E8F8F5] p-3 rounded-2xl border border-[#B7EBDD] flex items-center gap-2">
          <i data-lucide="cake" class="w-4 h-4 text-[#2E7D6D]"></i>
          <span id="modal-staff-note-regular-month-fixed-text">Sinh nhật: Tháng --</span>
        </div>
      </div>

      <!-- MỤC GHI CHÚ SỞ THÍCH -->
      <div>
        <label class="block text-xs font-bold text-[#2D2424] mb-1 flex items-center gap-1.5">
          <i data-lucide="file-text" class="w-3.5 h-3.5 text-[#E58A7B]"></i> Ghi Chú Sở Thích / Lưu Ý Khi Phục Vụ:
        </label>
        <textarea id="modal-staff-note-content" rows="3" placeholder="VD: Thích gội nước ấm, sấy mát, da đầu nhạy cảm, massage vai gáy nhẹ..." class="w-full bg-[#F7F2EC] border border-[#EFE8DF] rounded-2xl p-3 text-xs sm:text-sm text-[#2D2424] focus:outline-none focus:border-[#E58A7B] focus:bg-white transition leading-relaxed"></textarea>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeStaffCustomerNoteModal()" class="flex-1 py-3 rounded-full bg-[#F7F2EC] hover:bg-[#EFE8DF] text-[#7E7272] font-bold text-xs sm:text-sm cursor-pointer">Đóng</button>
        <button type="submit" id="btn-save-staff-customer-note" class="flex-1 py-3 rounded-full bg-[#E58A7B] hover:bg-[#D9796A] text-white font-bold text-xs sm:text-sm shadow-md shadow-[#E58A7B]/20 flex items-center justify-center gap-1.5 cursor-pointer">
          <i data-lucide="check" class="w-4 h-4"></i> Lưu Thông Tin
        </button>
      </div>
    </form>
  </div>
</div>
