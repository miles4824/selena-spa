<main id="view-history" class="flex-1 p-4 sm:p-6 max-w-2xl w-full mx-auto space-y-5 pb-28">
  <div class="flex justify-between items-center px-1">
    <div>
      <h2 class="text-2xl font-extrabold text-[#2D2424]">Toàn Bộ Hóa Đơn Tiệm</h2>
      <p class="text-xs sm:text-sm text-[#7E7272]">Danh sách hóa đơn của tất cả kỹ thuật viên</p>
    </div>
    <button onclick="loadHistoryView()" class="p-3 rounded-2xl bg-white hover:bg-[#FFF0EB] text-[#7E7272] hover:text-[#E58A7B] transition border border-[#F0EAE1] cursor-pointer">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Reusable Date Strip Component for Admin -->
  <div id="admin-date-strip-container" class="sticky top-0 z-30 bg-[#FAF6F1] py-1.5 -mx-1 px-1"></div>

  <!-- Admin Timeline List (Đồng bộ 1-1 với Staff) -->
  <div id="admin-receipts-list" class="space-y-3"></div>
</main>
