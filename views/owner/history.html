<main id="view-history" class="flex-1 p-4 sm:p-6 max-w-4xl w-full mx-auto space-y-5 pb-28">
  <div class="flex justify-between items-center px-1">
    <div>
      <h2 class="text-2xl font-extrabold text-[#2D2424]">Toàn Bộ Hóa Đơn Tiệm</h2>
      <p class="text-xs sm:text-sm text-[#7E7272]">Danh sách hóa đơn của tất cả kỹ thuật viên</p>
    </div>
    <button onclick="loadHistoryView()" class="p-3 rounded-2xl bg-white hover:bg-[#FFF0EB] text-[#7E7272] hover:text-[#E58A7B] transition border border-[#F0EAE1] cursor-pointer">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    </button>
  </div>

  <div class="spa-card p-5 sm:p-7 space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="text-base sm:text-lg font-extrabold text-[#2D2424]">Chi Tiết Hóa Đơn</h3>
      <span class="text-xs sm:text-sm text-[#E58A7B] font-bold" id="admin-receipt-count">0 hóa đơn</span>
    </div>

    <!-- Mobile View (Cards) -->
    <div id="admin-receipts-mobile-cards" class="block md:hidden space-y-3"></div>

    <!-- Desktop View (Clean Table) -->
    <div class="hidden md:block overflow-x-auto">
      <table class="w-full text-left text-sm min-w-[700px]">
        <thead>
          <tr class="border-b border-[#F0EAE1] text-[#7E7272] text-xs sm:text-sm font-bold">
            <th class="pb-3.5">Mã HD</th>
            <th class="pb-3.5">Dịch Vụ</th>
            <th class="pb-3.5">Khách</th>
            <th class="pb-3.5">KTV</th>
            <th class="pb-3.5 text-right">Thu Thực</th>
            <th class="pb-3.5 text-right">Thanh Toán</th>
          </tr>
        </thead>
        <tbody id="admin-receipts-table-body" class="divide-y divide-[#F0EAE1]"></tbody>
      </table>
    </div>
  </div>
</main>
