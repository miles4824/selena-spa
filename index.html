<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src * blob: data: 'unsafe-inline'; style-src * 'unsafe-inline'; img-src * data: https: blob:; font-src * data: https:; connect-src * https: blob:;">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Selena Spa">
  <title>Selena Spa - Luxury Skincare & Wellness</title>
  
  <!-- FAVICON & APP ICONS -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="meta-theme-color" content="#FAF6F1">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  
  <!-- LIBRARIES -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- CUSTOM STYLES -->
  <link rel="stylesheet" href="css/style.css?v=v0.0.2.8">
</head>
<body class="min-h-screen bg-spa-bg text-spa-dark font-sans selection:bg-spa-brand/20">
  <!-- APP ROOT CONTAINER -->
  <div id="app" class="min-h-screen"></div>

  <!-- 1. KHỐI 1: GIAO DIỆN (UI COMPONENTS - TAILWIND 4) -->
  <script src="js/UI/pull_to_refresh.js?v=v0.0.2.8"></script>
  <script src="js/UI/app_button.js?v=v0.0.2.8"></script>
  <script src="js/UI/app_input.js?v=v0.0.2.8"></script>
  <script src="js/UI/app_checkbox.js?v=v0.0.2.8"></script>
  <script src="js/UI/app_title.js?v=v0.0.2.8"></script>
  <script src="js/UI/app_card.js?v=v0.0.2.8"></script>
  <script src="js/UI/stat_card.js?v=v0.0.2.8"></script>
  <script src="js/UI/status_badge.js?v=v0.0.2.8"></script>
  <script src="js/UI/role_badge.js?v=v0.0.2.8"></script>
  <script src="js/UI/bed_card.js?v=v0.0.2.8"></script>
  <script src="js/UI/modal_shell.js?v=v0.0.2.8"></script>
  <script src="js/UI/theme_toggle.js?v=v0.0.2.8"></script>
  <script src="js/UI/bottom_nav.js?v=v0.0.2.8"></script>

  <!-- 2. KHỐI 2: TOÁN HỌC & NGHIỆP VỤ (LOGIC SERVICES & ENGINE) -->
  <script src="js/Logic/Services/phone_service.js?v=v0.0.2.8"></script>
  <script src="js/Logic/Services/home_service.js?v=v0.0.2.8"></script>
  <script src="js/Logic/Engine/config.js?v=v0.0.2.8"></script>
  <script src="js/Logic/Engine/firebase_engine.js?v=v0.0.2.8"></script>

  <!-- 3. KHỐI 3: MÀN HÌNH RENDER (SCREENS) -->
  <script src="js/Screens/Auth/login_screen.js?v=v0.0.2.8"></script>
  <script src="js/Screens/Home/staff_home.js?v=v0.0.2.8"></script>
  <script src="js/Screens/Home/owner_home.js?v=v0.0.2.8"></script>
  <script src="js/Screens/Home/home_screen.js?v=v0.0.2.8"></script>

  <!-- APP INITIALIZER & SCREEN ROUTER -->
  <script>
    function showScreen(screenName) {
      if (screenName === 'home') {
        if (typeof renderHomeScreen === 'function') renderHomeScreen();
      } else if (screenName === 'login') {
        if (typeof initLogin === 'function') initLogin();
      } else {
        const mainEl = document.getElementById('home-main-scroll');
        if (mainEl) {
          const titles = { pos: 'Tạo Ca / Vé Mới (POS)', history: 'Lịch Sử Tour', income: 'Báo Cáo & Thu Nhập' };
          mainEl.innerHTML = `
            <div class="p-8 rounded-3xl bg-white dark:bg-[#1C2428] border border-spa-border text-center space-y-4 shadow-xs">
              <div class="w-12 h-12 rounded-full bg-spa-brand/15 text-spa-brand mx-auto flex items-center justify-center">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
              </div>
              <h2 class="text-xl font-bold font-serif text-spa-dark dark:text-white">${titles[screenName] || screenName}</h2>
              <p class="text-xs text-spa-muted dark:text-white/60">Module ${screenName.toUpperCase()} đang được hoàn thiện theo chuẩn giao diện Zen Spa Mindora.</p>
              <button onclick="showScreen('home')" class="px-5 py-2.5 rounded-full bg-spa-brand text-white text-xs font-bold shadow-glow-brand cursor-pointer active:scale-95">
                Quay Lại Trang Chủ
              </button>
            </div>
          `;
          if (typeof updateNavSlidingPill === 'function') updateNavSlidingPill(screenName);
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }
      }
    }
    window.showScreen = showScreen;

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof initPullToRefresh === 'function') initPullToRefresh();
      
      // Khôi phục phiên đăng nhập nếu đã có
      const savedUser = (typeof getStored === 'function') ? getStored('current_user', null) : null;
      if (savedUser) {
        currentUser = savedUser;
        renderHomeScreen();
      } else {
        initLogin();
      }

      if (typeof initFirebaseEngine === 'function') initFirebaseEngine();
    });
  </script>
</body>
</html>
