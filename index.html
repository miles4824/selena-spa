<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: https:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; worker-src * blob: data: 'unsafe-inline'; style-src * 'unsafe-inline'; img-src * data: https: blob:; font-src * data: https:; connect-src * https: blob:;">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Selena Spa">
  <title>Selena Spa - Luxury Skincare & Wellness</title>
  
  <!-- FAVICON & APP ICONS -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="meta-theme-color" content="#FAF6F1">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  
  <!-- LIBRARIES -->
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- CUSTOM STYLES -->
  <link rel="stylesheet" href="css/style.css?v=v0.0.3.1">
  
  <!-- EARLY THEME INITIALIZATION (Ngăn chặn chớp giao diện và lệch màu) -->
  <script>
    (function() {
      try {
        var h = new Date().getHours();
        var defaultTheme = (h >= 6 && h < 18) ? 'light' : 'dark';
        var theme = defaultTheme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen bg-spa-bg text-spa-dark font-sans selection:bg-spa-brand/20">
  <!-- 1. LOGIN SCREEN CONTAINER -->
  <div id="container-login"></div>

  <!-- 2. MAIN VIEWS CONTAINERS (4 TABS) -->
  <div id="container-home" class="min-h-screen pb-28"></div>
  <div id="container-pos" class="min-h-screen pb-28 hidden"></div>
  <div id="container-history" class="min-h-screen pb-28 hidden"></div>
  <div id="container-income" class="min-h-screen pb-28 hidden"></div>

  <!-- 3. FLOATING BOTTOM NAVIGATION DOCK CONTAINER -->
  <div id="container-nav"></div>

  <!-- 1. KHỐI 1: GIAO DIỆN (UI COMPONENTS - TAILWIND 4) -->
  <script src="js/UI/pull_to_refresh.js?v=v0.0.3.0"></script>
  <script src="js/UI/app_button.js?v=v0.0.3.0"></script>
  <script src="js/UI/app_input.js?v=v0.0.3.0"></script>
  <script src="js/UI/app_checkbox.js?v=v0.0.3.0"></script>
  <script src="js/UI/app_title.js?v=v0.0.3.0"></script>
  <script src="js/UI/app_card.js?v=v0.0.3.0"></script>
  <script src="js/UI/stat_card.js?v=v0.0.3.0"></script>
  <script src="js/UI/status_badge.js?v=v0.0.3.0"></script>
  <script src="js/UI/role_badge.js?v=v0.0.3.0"></script>
  <script src="js/UI/bed_card.js?v=v0.0.3.0"></script>
  <script src="js/UI/modal_shell.js?v=v0.0.3.0"></script>
  <script src="js/UI/theme_toggle.js?v=v0.0.3.0"></script>
  <script src="js/UI/bottom_nav.js?v=v0.0.3.0"></script>

  <!-- 2. KHỐI 2: TOÁN HỌC & NGHIỆP VỤ (LOGIC SERVICES & ENGINE) -->
  <script src="js/Logic/Services/phone_service.js?v=v0.0.3.0"></script>
  <script src="js/Logic/Services/home_service.js?v=v0.0.3.0"></script>
  <script src="js/Logic/Engine/config.js?v=v0.0.3.0"></script>
  <script src="js/Logic/Engine/firebase_engine.js?v=v0.0.3.0"></script>

  <!-- 3. KHỐI 3: MÀN HÌNH RENDER (SCREENS) -->
  <script src="js/Screens/Auth/login_screen.js?v=v0.0.3.0"></script>
  <script src="js/Screens/Home/staff_home.js?v=v0.0.3.0"></script>
  <script src="js/Screens/Home/owner_home.js?v=v0.0.3.0"></script>
  <script src="js/Screens/Home/home_screen.js?v=v0.0.3.0"></script>

  <!-- APP INITIALIZER & MULTI-CONTAINER ROUTER -->
  <script>
    function showScreen(screenName) {
      window.scrollTo(0, 0);
      const tabName = (screenName === 'add') ? 'pos' : screenName;

      if (tabName === 'login') {
        if (typeof hideBottomNav === 'function') hideBottomNav();
        ['home', 'pos', 'history', 'income'].forEach(t => {
          const el = document.getElementById('container-' + t);
          if (el) el.classList.add('hidden');
        });
        const loginEl = document.getElementById('container-login');
        if (loginEl) loginEl.classList.remove('hidden');
        if (typeof initLogin === 'function') initLogin();
        return;
      }

      // Ẩn màn hình đăng nhập
      const loginEl = document.getElementById('container-login');
      if (loginEl) loginEl.classList.add('hidden');

      // Đồng bộ vị trí viên thuốc trên Bottom Nav
      if (typeof updateNavSlidingPill === 'function') {
        updateNavSlidingPill(tabName);
      }

      // Hoán đổi class hidden giữa các container (Bảo toàn nguyên vẹn form của các tab khác)
      const tabs = ['home', 'pos', 'history', 'income'];
      tabs.forEach(t => {
        const el = document.getElementById('container-' + t);
        if (!el) return;
        if (t === tabName) {
          el.classList.remove('hidden');
          el.classList.remove('view-enter-active');
          void el.offsetWidth; // Kích hoạt Luxury Fade Slide-in Transition
          el.classList.add('view-enter-active');
        } else {
          el.classList.add('hidden');
        }
      });

      const activeContainer = document.getElementById('container-' + tabName);

      // LAZY LOAD: Tab nào chưa có nội dung thì mới dựng lần đầu
      if (tabName === 'home') {
        if (activeContainer && (!activeContainer.hasChildNodes() || activeContainer.innerHTML.trim() === '')) {
          if (typeof renderHomeScreen === 'function') renderHomeScreen();
        } else if (typeof refreshLiveBeds === 'function') {
          // REFRESH HOOK: Tự động cập nhật số liệu mới nhất khi quay lại Home
          refreshLiveBeds();
        }
      } else if (tabName === 'pos') {
        if (activeContainer && (!activeContainer.hasChildNodes() || activeContainer.innerHTML.trim() === '')) {
          activeContainer.innerHTML = renderPlaceholderTab('pos', 'Tạo Ca / Vé Mới (POS)');
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }
      } else if (tabName === 'history') {
        if (activeContainer && (!activeContainer.hasChildNodes() || activeContainer.innerHTML.trim() === '')) {
          activeContainer.innerHTML = renderPlaceholderTab('history', 'Lịch Sử Tour');
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }
      } else if (tabName === 'income') {
        if (activeContainer && (!activeContainer.hasChildNodes() || activeContainer.innerHTML.trim() === '')) {
          activeContainer.innerHTML = renderPlaceholderTab('income', 'Báo Cáo & Thu Nhập');
          if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        }
      }
    }
    window.showScreen = showScreen;

    function renderPlaceholderTab(screenName, title) {
      const isOwner = (typeof isUserOwner === 'function' && typeof currentUser !== 'undefined') ? isUserOwner(currentUser) : false;
      return `
        <main class="p-4 sm:p-6 max-w-5xl mx-auto space-y-5">
          ${screenName === 'income' ? `
            <!-- Header Báo cáo & Tài khoản (Chỉ xuất hiện ở tab Báo cáo/Thu nhập theo bản gốc) -->
            <div class="p-4 sm:p-5 rounded-3xl bg-spa-card border border-spa-border shadow-xs flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-spa-brand/15 text-spa-brand flex items-center justify-center font-bold text-base shadow-2xs">
                  ${isOwner ? '👑' : '💆'}
                </div>
                <div>
                  <div class="font-extrabold text-base text-spa-dark">
                    Chào <span class="text-spa-brand">${currentUser ? (currentUser.name || currentUser.username) : 'Bạn'}</span>,
                  </div>
                  <div class="text-xs text-spa-muted font-medium">
                    ${isOwner ? '👑 Chủ Sáng Lập' : '💆 Kỹ Thuật Viên'}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                ${typeof ThemeToggle === 'function' ? ThemeToggle({ customClass: 'w-9 h-9' }) : ''}
                <button type="button" onclick="handleLogout()" title="Đăng xuất" class="p-2 rounded-full bg-spa-card hover:bg-rose-50 text-spa-muted hover:text-rose-600 border border-spa-border transition cursor-pointer active:scale-90 flex items-center justify-center">
                  <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          ` : ''}
          <div class="p-8 rounded-3xl bg-spa-card border border-spa-border text-center space-y-4 shadow-xs">
            <div class="w-12 h-12 rounded-full bg-spa-brand/15 text-spa-brand mx-auto flex items-center justify-center">
              <i data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold font-serif text-spa-dark">${title}</h2>
            <p class="text-xs text-spa-muted">Module ${screenName.toUpperCase()} đang được hoàn thiện theo chuẩn giao diện Zen Spa Mindora.</p>
            <button onclick="navigateTab('home')" class="px-5 py-2.5 rounded-full bg-spa-brand text-white text-xs font-bold shadow-glow-brand cursor-pointer active:scale-95">
              Quay Lại Trang Chủ
            </button>
          </div>
        </main>
      `;
    }

    function handleLogout() {
      if (confirm('Bạn có chắc chắn muốn đăng xuất không?')) {
        if (typeof stopHomeRealtimeTicker === 'function') stopHomeRealtimeTicker();
        currentUser = null;
        try {
          localStorage.removeItem('selena_current_user');
        } catch (e) {}
        if (typeof hideBottomNav === 'function') hideBottomNav();
        ['home', 'pos', 'history', 'income'].forEach(t => {
          const el = document.getElementById('container-' + t);
          if (el) el.classList.add('hidden');
        });
        showScreen('login');
      }
    }
    window.handleLogout = handleLogout;

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof initTheme === 'function') initTheme();
      if (typeof initPullToRefresh === 'function') initPullToRefresh();
      
      // Khôi phục phiên đăng nhập nếu đã có
      const savedUser = (typeof getStored === 'function') ? getStored('current_user', null) : null;
      if (savedUser) {
        currentUser = savedUser;
        if (typeof renderBottomNav === 'function') renderBottomNav('home');
        if (typeof showBottomNav === 'function') showBottomNav();
        showScreen('home');
      } else {
        showScreen('login');
      }

      if (typeof initFirebaseEngine === 'function') initFirebaseEngine();
    });
  </script>
</body>
</html>
