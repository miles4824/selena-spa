    .safe-area-top {

    }
    @media (min-width: 768px) {
      .safe-area-top {
        padding-top: 1.5rem !important;
      }
    }
    [class*="app-card-"] {
      border-radius: 28px !important;
      -webkit-border-radius: 28px !important;
      overflow: hidden !important;
      position: relative !important;
      isolation: isolate !important;
      -webkit-mask-image: -webkit-radial-gradient(white, black) !important;
      mask-image: radial-gradient(white, black) !important;
      -webkit-transform: translateZ(0) !important;
      transform: translateZ(0) !important;
      -webkit-backface-visibility: hidden !important;
      backface-visibility: hidden !important;
    }
  </style>
  
  <!-- EARLY THEME INITIALIZATION (Nhớ cài đặt của người dùng & Ngăn chặn chớp giao diện) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('selena_theme');
        var h = new Date().getHours();
        var defaultTheme = (h >= 6 && h < 18) ? 'light' : 'dark';
        var theme = (saved === 'dark' || saved === 'light') ? saved : defaultTheme;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
